name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:      # also adds a manual "Run workflow" button

concurrency: deploy-enkuan

env:
  VPS_HOST: 92.112.193.206
  # The server's public host key (not a secret). Pins the connection to this server.
  VPS_HOST_KEY: "92.112.193.206 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIusaPb9t/GiWO9yiaD8WLjVM0sUhonQ4sPOMAQ0PLD6"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Rebuild the key from the secret, tolerating copy damage: extra lines around it,
          # spaces or Windows line endings, or everything pasted onto one line.
          raw=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          echo "Secret: ${#raw} characters, $(printf '%s\n' "$raw" | wc -l) lines"
          case "$raw" in *"BEGIN OPENSSH PRIVATE KEY"*) echo "BEGIN line: found";; *) echo "BEGIN line: MISSING";; esac
          case "$raw" in *"END OPENSSH PRIVATE KEY"*)   echo "END line: found";;   *) echo "END line: MISSING";;   esac
          body=$(printf '%s\n' "$raw" | sed -n '/BEGIN OPENSSH PRIVATE KEY/,/END OPENSSH PRIVATE KEY/p' | sed -e 's/.*BEGIN OPENSSH PRIVATE KEY-*//' -e 's/-*END OPENSSH PRIVATE KEY.*//' | tr -d ' \t\n-')
          echo "Key body: ${#body} characters (a valid key is roughly 300-400)"
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s' "$body" | fold -w 70; echo; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub   # fails here if the secret is not a valid key
          echo "::notice::Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Trigger deploy on the VPS
        # The key is locked to the deploy command on the server, so no command is passed.
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 root@"$VPS_HOST"
